name: Sync Fork

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # 👇 加上这两行，赋予创建 PR 和写入内容的权限
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: tgymnich/fork-sync@v2.0
        with:
          owner: zhaoyuxiangyyds-lab
          base: main
          head: main
